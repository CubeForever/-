name: 打包生命记录仪

on:
  # 推送标签时自动打包（例如 v1.0.0）
  push:
    tags:
      - 'v*'
  # 也可以在 GitHub 网页上手动触发
  workflow_dispatch:

jobs:
  build-mac:
    name: 打包 macOS 版
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 PyInstaller
        run: pip3 install pyinstaller --break-system-packages

      - name: 打包 macOS 应用
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "生命记录仪" \
            life_recorder_mac.py

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: 生命记录仪-macOS
          path: dist/生命记录仪.app
          retention-days: 90

  build-windows:
    name: 打包 Windows 版
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 Windows 应用
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "生命记录仪" `
            life_recorder.py

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: 生命记录仪-Windows
          path: dist/生命记录仪.exe
          retention-days: 90

  release:
    name: 发布到 Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: 生命记录仪-macOS
          path: artifacts/mac

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: 生命记录仪-Windows
          path: artifacts/win

      - name: 创建 Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*
            artifacts/win/*
          generate_release_notes: true
